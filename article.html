    <script>
      ;(function () {
        var themes = ['neon', 'outrun', 'coldwave', 'crimson', 'phosphor', 'chrome', 'score']
        try {
          var t = localStorage.getItem('ns-theme')
          var m = localStorage.getItem('ns-mode')
          var el = document.documentElement
          if (t && themes.indexOf(t) > -1) el.dataset.theme = t
          if (m === 'light' || m === 'dark') {
            el.dataset.mode = m
            el.classList.toggle('dark', m === 'dark')
          }
        } catch (e) {}
      })()
    </script>
